# GitLab Runner authentication token. Encrypted with SOPS + age.
#
# HOW TO FILL THIS IN
#   1. GitLab > Admin Area > CI/CD > Runners > "New instance runner".
#      Set "Run untagged jobs" on. LEAVE THE EXPIRATION DATE EMPTY (see below).
#   2. Copy the glrt-... authentication token it shows you once.
#   3. Decrypt this file (VS Code task "Decrypt File", or
#      `sops --decrypt --in-place apps/gitlab-runner/runner-token.secret.yaml`),
#      replace the runner-token value, then re-encrypt ("Encrypt File", or
#      `sops --encrypt --in-place ...`). Never commit it decrypted.
#
# WHY THE TOKEN MUST NOT EXPIRE
#   The chart keeps config.toml on an in-memory emptyDir. If the token has an
#   expiration date the runner rotates it, writes the new value only to that
#   tmpfs, and loses it on the next pod restart -- after which the token stored
#   here no longer authenticates and the runner goes offline. This surfaces
#   roughly 30 days after deploy and is baffling if you have not seen it before.
#
# WHY THERE ARE TWO KEYS
#   The chart projects both keys with an explicit `items:` list and no
#   `optional: true`. If runner-registration-token is missing the pod hangs
#   mounting the volume. It must be present but empty -- the legacy registration
#   flow is unused; GitLab 16+ uses the runner-token (authentication) flow.
apiVersion: v1
kind: Secret
metadata:
    name: gitlab-runner-token
    namespace: gitlab-runner
type: Opaque
stringData:
    runner-registration-token: ""
    runner-token: ENC[AES256_GCM,data:WFcwYeLYE0KqeofWM0PjV3sxjHGSRQsQ/vix2P7igJiRIo8X1A85VbefsWHFCHeJ3vRkemOQW/I=,iv:lsdggf7lmoDISpVo6tNezxRclPjdlA5MGPJdWLRMF1M=,tag:nd5oydZtCWlfOIv5QKd+Bw==,type:str]
sops:
    age:
        - enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSBrSWJwWGorVjg0ZklTYWg1
            ZXVKem44eVhxTXp2L3UxVFd2Mm1ZZFEzUXc0Clh6MnRQOXQwMFlLYVkrY3FmcjJ5
            d3JNZi9EOXlBYVMxN1J3bGd5YmR1eGcKLS0tIE4rblB6bW1GakVkUXQ2RHNyR2ox
            dVJMQXg5eVE0cHNyRHFtc2dFNk9pTXcKGX6ZbA5BmPAPDw5ktQLcY0tWguP3yq0Y
            TlodH7OaZVkS1KHtqD4VIRgvbQEhkdSElBBswlEGN5pfjoY3sx/Dmg==
            -----END AGE ENCRYPTED FILE-----
          recipient: age1r0y2hakc227f26hlnuhsk6pfuy7qauqy2ak2ntwwjdpr4q6fuvuqdk8kpq
