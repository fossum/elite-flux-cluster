# CI job pods run as this ServiceAccount. It has NO RoleBinding anywhere and no
# projected API token, so a compromised job holds no Kubernetes credential at all.
# That is what makes the manager's ability to read Secrets in this namespace
# harmless: the jobs themselves cannot use the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-job
  namespace: gitlab-runner-jobs
automountServiceAccountToken: false
---
# Belt and braces: if anything ever lands on the namespace default SA, it gets
# no token either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: gitlab-runner-jobs
automountServiceAccountToken: false
