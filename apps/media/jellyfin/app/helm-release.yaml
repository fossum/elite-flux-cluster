apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 15m
  chart:
    spec:
      chart: jellyfin
      version: ^22.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 25m
  install:
    createNamespace: false
  valuesFrom:
    - kind: Secret
      name: media-config
      valuesKey: BASE_DOMAIN
      targetPath: baseDomain
    - kind: Secret
      name: media-config
      valuesKey: HP_API_JELLYFIN
      targetPath: ingress.main.integrations.homepage.widget.custom.key
      optional: true
  values:
    # https://truecharts.org/charts/stable/jellyfin/

    persistence:
      config:
        enabled: true
        storageClass: longhorn
        size: 5Gi
        retain: true
        volumeName: pvc-6462a930-f27f-43c9-b7ed-7fb6a5fa403c
      data:
        enabled: true
        storageClass: longhorn
        size: 10Gi
        retain: true
        volumeName: pvc-55500b9f-2bd5-465e-92cf-da02e4aa602d
      shared:
        enabled: true
        type: pvc
        existingClaim: dvr-nfs-pvc
        mountPath: /shared

    service:
      main:
        type: LoadBalancer
        loadBalancerIP: "192.168.1.158"

    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: "{{ .Release.Name }}.{{ .Values.baseDomain }}"
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: thefoss-le-prod
          homepage:
            enabled: true
            group: "Media"
