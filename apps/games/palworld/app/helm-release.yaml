apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: palworld
  namespace: games
spec:
  interval: 5m
  timeout: 20m
  chart:
    spec:
      chart: palworld
      version: 5.3.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: game-placement-config
    - kind: ConfigMap
      name: game-config
      valuesKey: BASE_DOMAIN
      targetPath: palworld.game.PublicIP
    - kind: ConfigMap
      name: game-config
      valuesKey: GAME_PASSWORD
      targetPath: palworld.game.ServerPassword
    - kind: ConfigMap
      name: game-config
      valuesKey: RCON_PASSWORD
      targetPath: palworld.game.AdminPassword
  values:
    global:
      fallbackDefaults:
        storageClass: "truenas-nfs-api-csi"

    TZ: "America/Los_Angeles"

    persistence:
      steamcmd:
        enabled: true
        storageClass: "truenas-nfs-api-csi"
        retain: true
        volumeName: pvc-894ddc3d-af52-4f32-91c3-18b8b305df12
      serverfiles:
        enabled: true
        storageClass: "truenas-nfs-api-csi"
        retain: true
        volumeName: pvc-8ad969e0-8558-429e-bddf-76406e048439

    palworld:
      game:
        ServerName: "Venture Pals"
        ServerDescription: "Venture Brothers Dedicated Palworld Server"
        bUseAuth: true
        # AllowConnectPlatform: "Steam|Xbox"
      params:
        - -players=32

    service:
      main:
        type: LoadBalancer
