apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: palworld
  namespace: games
spec:
  interval: 5m
  timeout: 20m
  chart:
    spec:
      chart: palworld
      version: 5.3.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: game-placement-config
    - kind: ConfigMap
      name: game-config
      valuesKey: GAME_PASSWORD
      targetPath: palworld.game.ServerPassword
    - kind: ConfigMap
      name: game-config
      valuesKey: RCON_PASSWORD
      targetPath: palworld.game.AdminPassword
  values:
    global:
      fallbackDefaults:
        storageClass: "truenas-nfs-api-csi"

    TZ: "America/Los_Angeles"

    persistence:
      steamcmd:
        enabled: true
        storageClass: "truenas-nfs-api-csi"
        retain: true
        volumeName: pvc-894ddc3d-af52-4f32-91c3-18b8b305df12
      serverfiles:
        enabled: true
        storageClass: "truenas-nfs-api-csi"
        retain: true
        volumeName: pvc-8ad969e0-8558-429e-bddf-76406e048439

    palworld:
      update_public_ip: true
      backup:
        enabled: true
        interval: 120
        to_keep: 2160
      game:
        ServerName: "Venture Pals"
        ServerDescription: "Venture Brothers Dedicated Palworld Server"
        bUseAuth: true
        Difficulty: "Difficult"
        ExpRate: 1.2
        BuildObjectDeteriorationDamageRate: 0
        BaseCampMaxNum: 5
        BaseCampMaxNumInGuild: 4
        PalEggDefaultHatchingTime: 36.0
        bIsMultiplay: true
        bCanPickupOtherGuildDeathPenaltyDrop: true
        bExistPlayerAfterLogout: true
        bIsUseBackupSaveData: true
        # AllowConnectPlatform: "Steam|Xbox"
      params:
        - -publiclobby
        - -players=32

    workload:
      main:
        strategy: Recreate
        podSpec:
          containers:
            main:
              env:
                BACKUPS_TO_KEEP: "2160"

    service:
      main:
        type: LoadBalancer
