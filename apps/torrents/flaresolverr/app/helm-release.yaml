apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: torrents
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: enabled
spec:
  interval: 15m
  chart:
    spec:
      chart: flaresolverr
      version: ^17.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: vpn-addon-config
      valuesKey: addons.yaml
  values:
    securityContext:
      container:
        runAsUser: 0
        runAsGroup: 0
        readOnlyRootFilesystem: false

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                LOG_LEVEL: info
                LOG_HTML: "false"
                CAPTCHA_SOLVER: turnstile
                TZ: America/Los_Angeles

    persistence:
      shm:
        enabled: true
        type: emptyDir
        medium: Memory
        mountPath: /dev/shm
