apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comfyui
  namespace: development
  annotations:
    nginx.org/websocket-services: comfyui
    nginx.org/proxy-connect-timeout: "3600s"
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
    nginx.org/client-max-body-size: "0"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "ComfyUI"
    gethomepage.dev/description: "AI Image Generation"
    gethomepage.dev/group: "Services"
    gethomepage.dev/icon: "si-comfyui" # Simple icon placeholder
spec:
  ingressClassName: external
  tls:
    - hosts:
        - comfyui.thefoss.org
      secretName: comfyui-tls
  rules:
    - host: comfyui.thefoss.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: comfyui
                port:
                  number: 8188
