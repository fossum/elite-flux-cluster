---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: momentum-day-trader
  namespace: finance
spec:
  chart:
    spec:
      chart: ./charts/generic-npm
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: cluster
        namespace: flux-system
  interval: 15m0s
  timeout: 15m0s
  valuesFrom:
    - kind: Secret
      name: momentum-day-trader-secrets
      valuesKey: GEMINI_API_KEY
      targetPath: workload.main.podSpec.containers.main.env.GEMINI_API_KEY
    - kind: Secret
      name: momentum-day-trader-secrets
      valuesKey: FMP_API_KEY
      targetPath: workload.main.podSpec.containers.main.env.FMP_API_KEY
    - kind: Secret
      name: momentum-day-trader-secrets
      valuesKey: APP_URL
      targetPath: workload.main.podSpec.containers.main.env.APP_URL
    - kind: Secret
      name: momentum-day-trader-secrets
      valuesKey: ENCRYPTION_KEY
      targetPath: workload.main.podSpec.containers.main.env.ENCRYPTION_KEY
    - kind: Secret
      name: momentum-day-trader-secrets
      valuesKey: VITE_GOOGLE_CLIENT_ID
      targetPath: workload.main.podSpec.containers.main.env.VITE_GOOGLE_CLIENT_ID
    - kind: Secret
      name: momentum-day-trader-cnpg-app
      valuesKey: uri
      targetPath: workload.main.podSpec.containers.main.env.DATABASE_URL
    - kind: Secret
      name: momentum-day-trader-secrets
      valuesKey: GEMINI_API_KEY
      targetPath: workload.main.podSpec.containers.engine.env.GEMINI_API_KEY
    - kind: Secret
      name: momentum-day-trader-secrets
      valuesKey: FMP_API_KEY
      targetPath: workload.main.podSpec.containers.engine.env.FMP_API_KEY
    - kind: Secret
      name: momentum-day-trader-secrets
      valuesKey: APP_URL
      targetPath: workload.main.podSpec.containers.engine.env.APP_URL
    - kind: Secret
      name: momentum-day-trader-secrets
      valuesKey: ENCRYPTION_KEY
      targetPath: workload.main.podSpec.containers.engine.env.ENCRYPTION_KEY
    - kind: Secret
      name: momentum-day-trader-secrets
      valuesKey: VITE_GOOGLE_CLIENT_ID
      targetPath: workload.main.podSpec.containers.engine.env.VITE_GOOGLE_CLIENT_ID
    - kind: Secret
      name: momentum-day-trader-cnpg-app
      valuesKey: uri
      targetPath: workload.main.podSpec.containers.engine.env.DATABASE_URL

  values:
    image:
      repository: fossum/generic-npm
      tag: latest
      pullPolicy: Always
    workload:
      main:
        podSpec:
          annotations:
            fluxcd.io/git-repo: flux-system/momentum-day-trader
          dnsConfig:
            options:
              - name: ndots
                value: "5"
          initContainers:
            init-db-and-sync:
              enabled: true
              type: init
              imageSelector: image
              command:
                - sh
                - -c
                - |
                  until nc -z -w 2 momentum-day-trader-cnpg-rw 5432; do echo "waiting for postgres..."; sleep 2; done;
                  echo "Postgres is ready."
                  if [ -d "/app/.git" ]; then
                    echo "Pulling latest code..."
                    cd /app && git pull
                  fi
          containers:
            main:
              enabled: true
              primary: true
              imageSelector: image
              args:
                - sh
                - -c
                - "until nc -z localhost 8081; do echo 'Waiting for python-engine to listen on port 8081...'; sleep 1; done; node dist/server.cjs"
              env:
                NODE_ENV: production
                PORT: "3000"
                PYTHON_ENGINE_WS_URL: ws://localhost:8081
                BUILD_APP: "true"
            engine:
              enabled: true
              primary: false
              imageSelector: image
              args:
                - sh
                - -c
                - "npm run start:engine"
              env:
                PORT: "3000"
                BUILD_APP: "false"
                FIREBASE_SERVICE_ACCOUNT_PATH: "/app/service-account.json"
              probes:
                liveness:
                  enabled: false
                readiness:
                  enabled: false
                startup:
                  enabled: false
    ingress:
      main:
        enabled: true
        annotations:
          nginx.org/websocket-services: momentum-day-trader-generic-npm
        ingressClassName: external
        hosts:
          - host: trader.thefoss.org
            paths:
              - path: /
                pathType: ImplementationSpecific
              - path: /vite-hmr
                pathType: ImplementationSpecific
        integrations:
          certManager:
            enabled: true
            certificateIssuer: thefoss-le-prod
    persistence:
      app-data:
        enabled: true
        type: pvc
        existingClaim: momentum-day-trader-pvc
        mountPath: /app
        targetSelectAll: true
