apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-cnpg-main
  namespace: nextcloud
spec:
  instances: 2

  imageName: "ghcr.io/cloudnative-pg/postgresql:17.4"

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud

  storage:
    size: "20Gi"
    storageClass: "truenas-nfs-api-csi"

  walStorage:
    size: "10Gi"
    storageClass: "longhorn"

  monitoring:
    enablePodMonitor: true

  enableSuperuserAccess: true

  backup:
    retentionPolicy: "14d"
    target: primary
    barmanObjectStore:
      destinationPath: "s3://nextcloud-postgres-backup/"
      endpointURL: "http://minio-api.storage.svc.cluster.local:10106"
      s3Credentials:
        accessKeyId:
          name: nextcloud-cnpg-s3-backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: nextcloud-cnpg-s3-backup-creds
          key: ACCESS_SECRET_KEY
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nextcloud-cnpg-main-daily
  namespace: nextcloud
spec:
  cluster:
    name: nextcloud-cnpg-main
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  method: barmanObjectStore
