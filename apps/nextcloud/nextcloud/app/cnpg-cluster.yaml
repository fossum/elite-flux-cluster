apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-cnpg-main
  namespace: nextcloud
spec:
  instances: 2

  imageName: "ghcr.io/cloudnative-pg/postgresql:17.11"

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud

  storage:
    size: "30Gi"
    storageClass: "truenas-nfs-api-csi"
    resizeInUseVolumes: true

  walStorage:
    size: "30Gi"
    storageClass: "longhorn"
    resizeInUseVolumes: true

  postgresql:
    parameters:
      archive_timeout: "15min"
      wal_keep_size: "2048MB"
      max_wal_size: "10GB"
      min_wal_size: "2GB"
      checkpoint_completion_target: "0.9"
      checkpoint_timeout: "15min"

  monitoring:
    enablePodMonitor: true

  enableSuperuserAccess: true
