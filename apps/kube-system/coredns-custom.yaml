apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  thefoss.server: |
    thefoss.org:53 {
        errors
        cache 30
        hosts {
            192.168.1.10 truenas.thefoss.org
            192.168.1.10 truenas.thefoss.org.thefoss.org
            fallthrough
        }
        forward . /etc/resolv.conf
    }
