apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-alerts
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cnpg.health
      rules:
        - alert: CloudNativePGWALArchivingFailing
          expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 10
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "CNPG WAL archiving is failing"
            description: "CNPG cluster {{ $labels.job }} in namespace {{ $labels.namespace }} has {{ $value }} unarchived WAL files queued."

        - alert: CloudNativePGClusterNotHealthy
          expr: cnpg_collector_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CNPG cluster is not healthy"
            description: "CNPG cluster pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is reporting unhealthy state."

    - name: storage.health
      rules:
        - alert: PersistentVolumeFillingUp
          expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PersistentVolume disk space is above 85%"
            description: "PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }} is at {{ $value | humanizePercentage }} utilization."
